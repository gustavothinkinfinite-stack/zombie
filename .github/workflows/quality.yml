name: Calidad del juego

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Sintaxis y regresiones
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./*.js ./*.cjs)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find ./tests ./tools -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | sort -z)
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Detectar recursos modificados sin renovar caché
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No hay revisión anterior comparable; se omite esta comprobación."
            exit 0
          fi
          git cat-file -e "${base}^{commit}"
          BASE_SHA="$base" python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlsplit

          base = os.environ["BASE_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR",
               base, "HEAD", "--", "*.js", "*.css"], text=True
          ).splitlines()
          old_html = subprocess.check_output(
              ["git", "show", f"{base}:index.html"], text=True
          )
          new_html = open("index.html", encoding="utf-8").read()

          def versions(html):
              assets = {}
              for tag in re.findall(r'<(?:script|link)\b[^>]*>', html, flags=re.I):
                  is_script = bool(re.match(r'<script\b', tag, flags=re.I))
                  if not is_script and not re.search(
                      r'\brel\s*=\s*["\']stylesheet["\']', tag, flags=re.I
                  ):
                      continue
                  attr = "src" if is_script else "href"
                  match = re.search(
                      r'\b' + attr + r'\s*=\s*["\']([^"\']+)["\']',
                      tag, flags=re.I
                  )
                  if not match:
                      continue
                  url = urlsplit(match.group(1))
                  if url.scheme or url.netloc or not re.search(
                      r'\.(?:js|css)$', url.path, flags=re.I
                  ):
                      continue
                  assets[url.path.removeprefix("./")] = url.query
              return assets

          before = versions(old_html)
          after = versions(new_html)
          stale = [
              path for path in changed if path in after and
              (not after[path] or after[path] == before.get(path))
          ]
          for path in stale:
              print(f"::error file=index.html::Cambió {path} sin renovar "
                    f"su parámetro de caché en index.html")
          if stale:
              sys.exit(1)
          print(f"Caché protegida: {len(changed)} JS/CSS modificados; "
                "todas las versiones vigentes.")
          PY
      - name: Probar todas las regresiones
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' -t tests < <(find ./tests -type f \( -name '*.test.js' -o -name '*.test.cjs' \) -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No se encontraron pruebas en tests/"
            exit 1
          fi
          for required in ./tests/elizabeth-case.test.js ./tests/save-backup.test.js; do
            if [[ ! -f "$required" ]]; then
              echo "::error file=${required}::Falta una prueba obligatoria"
              exit 1
            fi
          done
          failed=0
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            if node "${test}"; then
              echo "PASS: ${test}"
            else
              echo "::error file=${test}::Falló la prueba"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Total: ${#tests[@]} pruebas; fallidas: ${failed}"
          (( failed == 0 ))
