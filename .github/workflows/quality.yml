name: Calidad del juego

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Sintaxis y regresiones
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js ./tests/*.js; do
            node --check "$file"
          done
      - name: Probar investigaciones
        run: node tests/local-cases.test.js
      - name: Probar relaciones sociales
        run: node tests/social-relationships.test.js
      - name: Probar seguridad del guardado
        run: node tests/save-feedback.test.js
      - name: Probar controles y paneles
        run: node tests/modal-controls.test.js
      - name: Probar colisiones y navegación en comercios
        run: node tests/shop-collisions.test.js
      - name: Probar navegación y accesos entre barrios
        run: node tests/district-navigation.test.js
      - name: Probar recuperación de interiores guardados
        run: node tests/venue-restoration.test.js
      - name: Probar transiciones de la residencia
        run: node tests/residence-transitions.test.js
