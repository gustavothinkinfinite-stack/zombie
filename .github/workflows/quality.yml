name: Calidad del juego

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Sintaxis y regresiones
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./*.js ./*.cjs)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find ./tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | sort -z)
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Probar todas las regresiones
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' -t tests < <(find ./tests -type f \( -name '*.test.js' -o -name '*.test.cjs' \) -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No se encontraron pruebas en tests/"
            exit 1
          fi
          for required in ./tests/elizabeth-case.test.js ./tests/save-backup.test.js; do
            if [[ ! -f "$required" ]]; then
              echo "::error file=${required}::Falta una prueba obligatoria"
              exit 1
            fi
          done
          failed=0
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            if node "${test}"; then
              echo "PASS: ${test}"
            else
              echo "::error file=${test}::Falló la prueba"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Total: ${#tests[@]} pruebas; fallidas: ${failed}"
          (( failed == 0 ))
