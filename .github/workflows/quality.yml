name: Calidad del juego

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Sintaxis y regresiones
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js ./tests/*.js; do
            node --check "$file"
          done
      - name: Probar todas las regresiones
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(./tests/*.test.js)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No se encontraron archivos tests/*.test.js"
            exit 1
          fi
          failed=0
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            if node "${test}"; then
              echo "PASS: ${test}"
            else
              echo "::error file=${test}::Falló la prueba"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Total: ${#tests[@]} pruebas; fallidas: ${failed}"
          (( failed == 0 ))
